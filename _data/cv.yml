    Research (Project Lead):
      - bullet: "**ReScraper: Pre-training Data Curation** (01/2026 – present) — Graduate Researcher with Prof. Chenyan Xiong (CMU LTI); co-first author, under review. One 0.6B model (Qwen3-0.6B) replaces the heuristic HTML scraper and rule-based filter stack: it extracts a page's main content, then keeps, edits, deletes or rewrites it, trained by two-stage SFT on labels from three teachers. Pretraining 400M, 1.4B and 2.8B models on its output gives the best DCLM Core at every scale, +3.8–4.7% relative over the strongest baseline. Paper, code, model and 7.44B-token corpus released."
      - bullet: "**TraceML: Long-Horizon Auto-Research Agents** (01/2026 – present) — Graduate Researcher with Prof. Yiming Yang (CMU LTI); co-first author, NeurIPS 2026 Evaluations & Datasets Track. A dataset of 4,465 human Kaggle trajectories on 134 competitions, with 430 human and 207 agent trajectories paired on 7 of them and 151K code versions labeled by distilled Qwen3-1.7B labelers. Agents collapse into narrow loops, pivot too little or too much, and almost never return to abandoned approaches; a ~1K-token planning prompt distilled from human practice lifts scores on 5 of 7 competitions. Released an open-source toolkit that audits any agent run against human cohorts."

    Research (Collaborations):
      - bullet: "**Predicting RL Utility Across Scale** (05/2026 – 09/2026) — Graduate Researcher with Prof. Sanmi Koyejo (Stanford SAIL); under review. Which environments should an LLM learn from with RL, and does that choice hold as models scale: predicting how much RL post-training will improve a model from measurable properties of the environment, with the RL algorithm held fixed across math, coding and tool-use tasks."
      - bullet: "**Agentic Systems** (01/2026 – 05/2026) — Graduate Researcher with Prof. William W. Cohen (CMU MLD, sponsored by Google DeepMind); co-first author on one paper, both under review. Built a modular agentic-LLM framework around pseudo-tools and ran a study across 19 evaluation suites showing static workflows beat dynamic planners (0.64 vs 0.56 average correctness at half the cost); learned reusable agent subroutines from experience."

    Earlier Research:
      - bullet: "**University of Washington** (2023 – 2024) — transfer-learning matrix completion for multi-source recommendation with Prof. Wanning Chen (RMSE 0.6 → 0.35 on NetEase data); large-scale GitHub / Hugging Face mining of fork behavior in open source with Prof. Jane Tan and Prof. Yong Tan (first author, POMS 2025)."

    Teaching:

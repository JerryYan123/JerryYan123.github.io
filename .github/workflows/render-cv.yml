name: Render a CV
on:
  push:
    branches:
      - main
      - master
    paths:
      - "_data/cv.yml"
      - "assets/rendercv/design.yaml"
      - "assets/rendercv/locale.yaml"
      - "assets/rendercv/settings.yaml"
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rendercv:
    name: RenderCV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install RenderCV
        run: |
          pip install -r requirements.txt
      - name: RenderCV
        run: |
          cv_file=$(find _data  -maxdepth 1 -type f \( -name "cv.yaml" -o -name "cv.yml" \))
          if [ -z "$cv_file" ]; then
            echo "No cv.yml file found!"
            exit 1
          fi
          rendercv_dir=$(find assets -maxdepth 1 -type d -name "rendercv")
          if [ -z "$rendercv_dir" ]; then
            echo "No RenderCV config directory found!"
            exit 1
          fi
          settings=$(find $rendercv_dir -maxdepth 1 -type f \( -name "settings.yaml" -o -name "settings.yml" \))
          if [ -z "$settings" ]; then
            echo "Missing RenderCV config file!"
            exit 1
          fi
          # The website's CV page also reads `label` and `summary`, which RenderCV's
          # schema rejects, so render from a copy without those web-only fields.
          python - "$cv_file" <<'PY'
          import sys
          import yaml
          data = yaml.safe_load(open(sys.argv[1], encoding="utf-8"))
          for key in ("label", "summary", "image"):
              data["cv"].pop(key, None)
          with open("_data/cv.rendercv.yml", "w", encoding="utf-8") as fh:
              yaml.safe_dump(data, fh, sort_keys=False, allow_unicode=True, width=1000)
          PY
          rendercv render _data/cv.rendercv.yml --settings $settings
          rm _data/cv.rendercv.yml assets/rendercv/rendercv_output/*.typ
      # The CV page links the hand-made PDF in assets/pdf, so the rendered PDF is
      # kept as a build artifact only and not committed to the public repository.
      - name: Upload rendercv_output as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: RenderCV Output
          path: assets/rendercv/rendercv_output
